<!DOCTYPE html>
<html>

    <head>
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="style.css">

    </head>
    <body>        
        <h1 class="text-center">Carbon Footprint Calculator</h1>

    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="#" class="active">General</a></li>
        <li><a href="#">Home</a></li>
        <li><a href="#">Travel</a></li>
        <li><a href="#">Food</a></li>
        <li><a href="#">Electronic Usage</a></li>
        <li><a href="#">Shopping</a></li>
        <li><a href="#">Result</a></li>
      </ul>
      <button class="btn btn-home">Home</button>
    </nav>

<article class="card">  
  <div class="card-content">
    <h3 class="card-title">Fill the form below</h3>

    <div class="form-row">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Enter your name">
    </div>

    <div class="form-row">
      <label for="age">Age</label>
      <input id="age" type="number" placeholder="Enter your age">
    </div>

    <div class="form-row">
      <label for="country">Country</label>
      <select id="country">
        <option>Enter your country</option>
        <option>USA</option>
        <option>Canada</option>
        <option>UK</option>
        <option>Saudi Arabia</option>
      </select>
    </div>

    <div class="button-row">
      <button class="btn btn-submit">Prev</button>
      <button class="btn btn-submit">Next</button>
    </div>
  </div>
</article>

    </body>
</html>
